openapi: 3.0.3
info: {title: TUI conformance, version: 1.0.0}
servers: [{url: http://localhost:8000}]
security: [{Bearer: []}]
paths:
  /parents:
    get:
      operationId: listParents
      x-trex-tui:
        label: Parents
        aliases: [pa]
        identity-property: id
        default-sort: name
        columns:
          - {property: name, label: NAME, priority: 100}
          - {property: id, label: ID, priority: 90}
      responses:
        "200": {description: parents, content: {application/json: {schema: {$ref: "#/components/schemas/ParentList"}}}}
  /parents/{parent_id}:
    parameters: [{name: parent_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getParent
      responses:
        "200":
          description: parent
          content: {application/json: {schema: {$ref: "#/components/schemas/Parent"}}}
          links:
            children:
              operationId: listChildren
              parameters: {parent_id: "$response.body#/id"}
  /accounts:
    get:
      operationId: listAccounts
      responses:
        "200": {description: accounts, content: {application/json: {schema: {$ref: "#/components/schemas/AccountList"}}}}
  /accounts/{account_id}:
    parameters: [{name: account_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getAccount
      responses:
        "200":
          description: account
          content: {application/json: {schema: {$ref: "#/components/schemas/Account"}}}
          links:
            accountChildren:
              operationId: listChildren
              parameters: {parent_id: "$response.body#/id"}
  /children:
    get:
      operationId: listGlobalChildren
      security: []
      responses:
        "200": {description: children, content: {application/json: {schema: {$ref: "#/components/schemas/ChildList"}}}}
  /parents/{parent_id}/children:
    parameters: [{name: parent_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listChildren
      x-trex-tui:
        label: Children
        aliases: [ch]
        identity-property: id
        default-sort: name
        columns:
          - {property: name, label: NAME, priority: 100}
          - {property: id, label: ID, priority: 90}
      responses:
        "200": {description: children, content: {application/json: {schema: {$ref: "#/components/schemas/ChildList"}}}}
  /parents/{parent_id}/children/{child_id}:
    parameters:
      - {name: parent_id, in: path, required: true, schema: {type: string}}
      - {name: child_id, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9/ -]+$"}}
    get:
      operationId: getChild
      responses:
        "200": {description: child, content: {application/json: {schema: {$ref: "#/components/schemas/Child"}}}}
    patch:
      operationId: patchChild
      requestBody:
        required: true
        content: {application/merge-patch+json: {schema: {$ref: "#/components/schemas/ChildPatch"}}}
      responses:
        "200": {description: child, content: {application/json: {schema: {$ref: "#/components/schemas/Child"}}}}
  /parents/{parent_id}/children/{child_id}:archive:
    parameters:
      - {name: parent_id, in: path, required: true, schema: {type: string}}
      - {name: child_id, in: path, required: true, schema: {type: string}}
      - {name: notify, in: query, required: true, style: form, allowReserved: true, schema: {type: boolean, default: false}}
      - {name: X-Reason, in: header, required: true, style: simple, schema: {type: string}}
    post:
      operationId: archiveChild
      x-trex-tui:
        label: Archive child
        hotkey: x
        confirmation:
          title: Confirm archive
          message: Archive the selected child?
          destructive: false
      responses: {"202": {description: archived}}
  /parents/{parent_id}/children/{child_id}/events:
    parameters:
      - {name: parent_id, in: path, required: true, schema: {type: string}}
      - {name: child_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: streamChildEvents
      responses:
        "200": {description: events, content: {text/event-stream: {schema: {type: string}}}}
  /organizations/{organization_id}:
    parameters: [{name: organization_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getOrganization
      responses: {"200": {description: organization, content: {application/json: {schema: {$ref: "#/components/schemas/Organization"}}}}}
  /organizations/{organization_id}/projects/{project_id}:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string}}
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getProject
      responses: {"200": {description: project, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}}
  /organizations/{organization_id}/projects/{project_id}/children:
    parameters:
      - {name: organization_id, in: path, required: true, schema: {type: string}}
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: listAmbiguousChildren
      responses: {"200": {description: children, content: {application/json: {schema: {$ref: "#/components/schemas/ChildList"}}}}}
components:
  securitySchemes:
    Bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Parent:
      type: object
      required: [id, name]
      properties: {id: {type: string, readOnly: true}, name: {type: string}}
    ParentList:
      type: object
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Parent"}}}
    Account:
      type: object
      required: [id]
      properties: {id: {type: string, readOnly: true}, name: {type: string}}
    AccountList:
      type: object
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Account"}}}
    Child:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
        secret: {type: string, writeOnly: true}
    ChildList:
      type: object
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Child"}}}
    ChildPatch:
      type: object
      required: [name]
      properties: {name: {type: string, enum: [new, archived], default: new}, server_value: {type: string, readOnly: true}}
    Organization:
      type: object
      properties: {id: {type: string}}
    Project:
      type: object
      properties: {id: {type: string}}
