openapi: 3.0.3
info: {title: Partial capabilities, version: 1.0.0}
servers: [{url: http://localhost:8000}]
security: []
paths:
  /records:
    get:
      operationId: listRecords
      responses:
        "200":
          description: records
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordList"}
  /records/{record_id}:
    parameters:
      - {name: record_id, in: path, required: true, schema: {type: string}}
    patch:
      operationId: patchRecord
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: "#/components/schemas/RecordPatch"}
      responses:
        "200":
          description: record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Record"}
  /records/{record_id}/events:
    parameters:
      - {name: record_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: streamRecordEvents
      responses:
        "200":
          description: record events
          content:
            text/event-stream:
              schema: {type: string}
components:
  schemas:
    Record:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string}
    RecordList:
      type: object
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Record"}}
    RecordPatch:
      type: object
      required: [name]
      properties:
        name: {type: string}
