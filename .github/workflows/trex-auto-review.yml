name: TRex Automatic Code Review

on:
  workflow_run:
    workflows: [TRex PR CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: trex-review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Analyze trusted API data and update the review comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- trex-auto-review -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = process.env.CI_HEAD_SHA;
            const runID = Number(process.env.CI_RUN_ID);
            const runURL = process.env.CI_RUN_URL;
            const ciConclusion = process.env.CI_CONCLUSION;

            function safeMarkdown(value) {
              return String(value)
                .replace(/[\u0000-\u001f\u007f]/g, '')
                .replace(/@/g, '@\u200b')
                .replace(/([\\`*_[\]<>])/g, '\\$1')
                .slice(0, 500);
            }

            let associated = context.payload.workflow_run.pull_requests || [];
            if (associated.length === 0) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha,
              });
              associated = response.data;
            }

            const candidateNumbers = [...new Set(associated.map((candidate) => candidate.number))];
            const candidates = await Promise.all(candidateNumbers.map(async (pullNumber) => {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              return response.data;
            }));
            const openMatches = candidates.filter((candidate) =>
              candidate.state === 'open' && candidate.head.sha === headSha
            );
            if (openMatches.length !== 1) {
              core.notice(`Expected one open pull request for ${headSha}; found ${openMatches.length}.`);
              return;
            }

            const pull = openMatches[0];
            const pullNumber = pull.number;

            if (pull.draft) {
              core.notice(`Pull request #${pullNumber} is still a draft; skipping review comment.`);
              return;
            }
            if (pull.head.sha !== headSha) {
              core.notice(`Ignoring stale run ${runID}; pull request #${pullNumber} has a newer head.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runID,
              per_page: 100,
            });

            const findings = [];
            const counts = { CRITICAL: 0, MAJOR: 0, MINOR: 0 };
            const addFinding = (file, severity, issue, description) => {
              counts[severity] += 1;
              if (findings.length < 100) {
                findings.push({ file, severity, issue, description });
              }
            };

            for (const file of files) {
              if (!file.filename.endsWith('.go')) continue;

              const additions = (file.patch || '')
                .split('\n')
                .filter((line) => line.startsWith('+') && !line.startsWith('+++'))
                .map((line) => line.slice(1))
                .join('\n');

              if (/log.*(token|password|secret)/i.test(additions) &&
                  !/len\((token|password|secret)\)/i.test(additions)) {
                addFinding(
                  file.filename,
                  'CRITICAL',
                  'Potential secret logging detected',
                  'Secrets must not be logged; log non-sensitive metadata such as a value length instead.'
                );
              }

              if (file.filename.includes('handlers/') && additions.length > 0) {
                if (!additions.includes('errors.HandleServiceError') &&
                    !additions.includes('errors.BadRequest')) {
                  addFinding(
                    file.filename,
                    'MAJOR',
                    'Handler may be missing TRex error handling',
                    'Use the standard TRex error constructors and response handling.'
                  );
                }
                if (additions.includes('panic(') || additions.includes('log.Fatal')) {
                  addFinding(
                    file.filename,
                    'CRITICAL',
                    'Handler contains panic or fatal exit behavior',
                    'Return and translate errors instead of terminating the server from a handler.'
                  );
                }
              }

              if (file.filename.includes('dao/') || file.filename.includes('services/')) {
                if (additions.includes('db.Exec') && additions.includes('fmt.Sprintf')) {
                  addFinding(
                    file.filename,
                    'CRITICAL',
                    'Possible SQL injection path',
                    'Use parameterized queries instead of constructing SQL with string formatting.'
                  );
                }
                if (additions.includes('gorm.DB') && !additions.includes('WithContext')) {
                  addFinding(
                    file.filename,
                    'MAJOR',
                    'Database operation may be missing context',
                    'Use WithContext(ctx) for database operations.'
                  );
                }
              }

              if (file.filename.endsWith('_test.go') && additions.includes('func Test')) {
                const hasAssertion = [
                  'assert.', 'require.', 'Expect(', 't.Fatal', 't.Error'
                ].some((needle) => additions.includes(needle));
                if (!hasAssertion) {
                  addFinding(
                    file.filename,
                    'MINOR',
                    'Test may be missing an assertion',
                    'Confirm the test verifies an observable result or failure.'
                  );
                }
              }

              if (file.filename.includes('migrations/') &&
                  additions.includes('AutoMigrate') && !additions.includes('Rollback')) {
                addFinding(
                  file.filename,
                  'MAJOR',
                  'Migration may be missing rollback behavior',
                  'Migrations should provide a reversible rollback operation.'
                );
              }

              if (additions.includes('http.StatusCreated') && !additions.includes('Location')) {
                addFinding(
                  file.filename,
                  'MINOR',
                  'Created response may be missing a Location header',
                  'Set Location for successful 201 Created responses.'
                );
              }
            }

            if (ciConclusion !== 'success') {
              const failedSteps = jobs.flatMap((job) =>
                (job.steps || [])
                  .filter((step) => step.conclusion === 'failure')
                  .map((step) => `${job.name}: ${step.name}`)
              );
              const details = failedSteps.length > 0
                ? `Failed steps: ${failedSteps.map(safeMarkdown).join(', ')}`
                : `Workflow conclusion: ${safeMarkdown(ciConclusion)}`;
              addFinding(
                'TRex PR CI',
                'MAJOR',
                'Pull request CI did not pass',
                details
              );
            }

            let body = `${marker}\n## 🤖 TRex Automated Code Review\n\n`;
            body += `**Files reviewed:** ${files.length}\n`;
            body += `**CI:** [${safeMarkdown(ciConclusion)}](${runURL})\n`;
            body += `**Issues found:** ${counts.CRITICAL} Critical, ${counts.MAJOR} Major, ${counts.MINOR} Minor\n\n`;

            if (findings.length === 0) {
              body += '✅ No automated findings. Ready for human review.\n';
            } else {
              for (const severity of ['CRITICAL', 'MAJOR', 'MINOR']) {
                const matching = findings.filter((finding) => finding.severity === severity);
                if (matching.length === 0) continue;
                body += `### ${severity}\n\n`;
                for (const finding of matching) {
                  body += `- **${safeMarkdown(finding.file)}**: ${finding.issue}\n`;
                  body += `  - ${finding.description}\n`;
                }
                body += '\n';
              }
              if (findings.length < counts.CRITICAL + counts.MAJOR + counts.MINOR) {
                body += '_Additional findings were omitted to keep this comment bounded._\n\n';
              }
            }

            body += '---\n*Automated review from trusted GitHub API data; fork code was not executed by this commenting workflow.*';
            if (body.length > 60000) {
              body = `${body.slice(0, 59500)}\n\n_Comment truncated._`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }
