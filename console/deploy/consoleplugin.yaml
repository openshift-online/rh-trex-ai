apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: trex-console
spec:
  displayName: "Rh Trex Ai Console"
  backend:
    type: Service
    service:
      name: trex-console
      namespace: REPLACE_WITH_NAMESPACE
      port: 9443
      basePath: /
  proxy:
    - alias: api
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: REPLACE_WITH_API_SERVICE
          namespace: REPLACE_WITH_NAMESPACE
          port: REPLACE_WITH_API_PORT
